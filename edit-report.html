<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Report - Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page">
      <aside class="sidebar">
        <div class="sidebar-rail">
          <div class="sidebar-stack">
            <div class="sidebar-logo-mark" aria-label="OPS logo">O</div>
            <button class="ops-toggle" aria-label="Switch workspace">
              <span>OPS</span>
              <span class="ops-arrows" aria-hidden="true">
                <span class="mui-icon ops-arrow-icon">keyboard_arrow_up</span>
                <span class="mui-icon ops-arrow-icon is-down">keyboard_arrow_down</span>
              </span>
            </button>

            <nav class="sidebar-nav" aria-label="Main navigation">
              <button class="nav-item" aria-label="Dashboard"><span class="mui-icon nav-symbol nav-symbol-small">home</span></button>
              <button class="nav-item" aria-label="Signal map"><span class="mui-icon nav-symbol">public</span></button>
              <button class="nav-item" aria-label="Franchises">
                <span class="franchises-icon" aria-hidden="true">
                  <span class="franchises-line stroke-top"></span>
                  <span class="franchises-line stroke-middle"></span>
                  <span class="franchises-line stroke-bottom"></span>
                </span>
              </button>
              <button class="nav-item" aria-label="Dispatch"><span class="mui-icon nav-symbol">notifications</span></button>
              <button class="nav-item" aria-label="Users"><span class="mui-icon nav-symbol">person</span></button>
              <button class="nav-item active" aria-label="Settings"><span class="mui-icon nav-symbol">settings</span></button>
            </nav>
          </div>
        </div>
        <button class="collapse-btn" aria-label="Collapse sidebar">
          <span class="mui-icon">last_page</span>
        </button>
      </aside>

      <div class="content-shell">
        <header class="topbar">
          <div class="title-wrap">
            <span class="title-icon mui-icon">settings</span>
            <h1>Settings</h1>
          </div>
          <div class="profile-wrap">
            <button class="bell-btn" aria-label="Notifications"><span class="mui-icon">notifications</span></button>
            <div class="profile">
              <div class="avatar">A</div>
              <div class="profile-text">
                <strong>Aleena</strong>
                <span>HO User</span>
              </div>
              <span class="chevron mui-icon">expand_more</span>
            </div>
          </div>
        </header>

        <main class="main">
          <section class="edit-report-view" aria-label="Edit Report screen">
            <div class="edit-actions-row">
              <button id="edit-back-btn" class="back-btn">
                <span class="mui-icon">arrow_back</span> Back
              </button>
              <div class="edit-actions-right">
                <button id="edit-cancel-btn" class="btn btn-secondary">Cancel</button>
                <button class="btn btn-primary">Save</button>
              </div>
            </div>
            <div class="edit-divider"></div>

            <div class="edit-form-shell">
              <section class="edit-card report-card">
                <div id="incident-include-root"></div>
              </section>

              <section class="edit-card report-card">
                <label class="field-label required">Report Title</label>
                <div class="text-input">Vehicle Inspection Report</div>
                <button class="add-description-btn">
                  <span class="mui-icon">add</span> Add Description
                </button>
                <div id="report-type-root" class="report-type-field-wrap"></div>

                <div id="edit-sections-list" class="edit-sections-list report-card-sections">
                  <section class="edit-card section-card section-card-item" draggable="true">
                    <div class="section-card-header">
                      <span class="section-order-label">Section 1</span>
                      <button
                        class="section-drag-handle"
                        type="button"
                        aria-label="Drag to reorder section"
                        title="Drag to reorder"
                      >
                        <span class="mui-icon">drag_indicator</span>
                      </button>
                    </div>

                    <div class="section-subcard">
                      <label class="field-label">Section Name</label>
                      <div class="text-input">Section for questions</div>
                      <button class="add-description-btn" type="button">
                        <span class="mui-icon">add</span> Add Description
                      </button>
                    </div>

                    <div class="question-subcard">
                      <label class="field-label required">Question Statement</label>
                      <div class="text-input">Was the car locked?</div>
                      <button class="add-description-btn" type="button">
                        <span class="mui-icon">add</span> Add Description
                      </button>

                      <label class="field-label required">Answer Type</label>
                      <div class="select-input">Multiple choice <span class="mui-icon">expand_more</span></div>

                      <div class="option-row"><span>Yes</span><button class="icon-btn danger" type="button"><span class="mui-icon">delete</span></button></div>
                      <div class="option-row"><span>No</span><button class="icon-btn danger" type="button"><span class="mui-icon">delete</span></button></div>
                      <div class="option-row"><span>Maybe</span><button class="icon-btn danger" type="button"><span class="mui-icon">delete</span></button></div>

                      <button class="btn btn-outline-brand" type="button"><span class="mui-icon">add</span> Add option</button>

                      <div class="question-footer">
                        <label class="required-check">
                          <input type="checkbox" />
                          <span>Required</span>
                        </label>
                        <button class="btn btn-danger-outline" type="button">
                          <span class="mui-icon">delete</span> Delete
                        </button>
                      </div>
                    </div>
                  </section>
                </div>

                <button id="add-section-btn" class="btn btn-outline-brand add-section-btn" type="button">
                  <span class="mui-icon">add</span> Add Section
                </button>
              </section>
            </div>
          </section>
        </main>
      </div>
    </div>
    <template id="edit-section-template">
      <section class="edit-card section-card section-card-item" draggable="true">
        <div class="section-card-header">
          <span class="section-order-label">Section</span>
          <button
            class="section-drag-handle"
            type="button"
            aria-label="Drag to reorder section"
            title="Drag to reorder"
          >
            <span class="mui-icon">drag_indicator</span>
          </button>
        </div>

        <div class="section-subcard">
          <label class="field-label">Section Name</label>
          <div class="text-input">Section for questions</div>
          <button class="add-description-btn" type="button">
            <span class="mui-icon">add</span> Add Description
          </button>
        </div>

        <div class="question-subcard">
          <label class="field-label required">Question Statement</label>
          <div class="text-input">Was the car locked?</div>
          <button class="add-description-btn" type="button">
            <span class="mui-icon">add</span> Add Description
          </button>

          <label class="field-label required">Answer Type</label>
          <div class="select-input">Multiple choice <span class="mui-icon">expand_more</span></div>

          <div class="option-row"><span>Yes</span><button class="icon-btn danger" type="button"><span class="mui-icon">delete</span></button></div>
          <div class="option-row"><span>No</span><button class="icon-btn danger" type="button"><span class="mui-icon">delete</span></button></div>
          <div class="option-row"><span>Maybe</span><button class="icon-btn danger" type="button"><span class="mui-icon">delete</span></button></div>

          <button class="btn btn-outline-brand" type="button"><span class="mui-icon">add</span> Add option</button>

          <div class="question-footer">
            <label class="required-check">
              <input type="checkbox" />
              <span>Required</span>
            </label>
            <button class="btn btn-danger-outline" type="button">
              <span class="mui-icon">delete</span> Delete
            </button>
          </div>
        </div>
      </section>
    </template>
    <script type="module" src="./edit-report-dropdowns.jsx"></script>
    <script>
      const editBackBtn = document.getElementById("edit-back-btn");
      const editCancelBtn = document.getElementById("edit-cancel-btn");
      const editSectionsList = document.getElementById("edit-sections-list");
      const addSectionBtn = document.getElementById("add-section-btn");
      const sectionTemplate = document.getElementById("edit-section-template");
      let draggedSection = null;

      function navigateBackToList() {
        window.location.href = "./index.html";
      }

      function updateSectionOrderLabels() {
        Array.from(editSectionsList.querySelectorAll(".section-card-item")).forEach((section, index) => {
          const label = section.querySelector(".section-order-label");
          if (label) {
            label.textContent = `Section ${index + 1}`;
          }
        });
      }

      function clearDropTargets() {
        editSectionsList.querySelectorAll(".section-card-item").forEach((section) => {
          section.classList.remove("is-drop-target");
        });
      }

      function createSectionCard() {
        const sectionFragment = sectionTemplate.content.cloneNode(true);
        return sectionFragment.querySelector(".section-card-item");
      }

      function getDragAfterElement(container, y) {
        const draggableSections = [
          ...container.querySelectorAll(".section-card-item:not(.is-dragging)"),
        ];

        return draggableSections.reduce(
          (closest, section) => {
            const box = section.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;

            if (offset < 0 && offset > closest.offset) {
              return { offset, element: section };
            }

            return closest;
          },
          { offset: Number.NEGATIVE_INFINITY, element: null },
        ).element;
      }

      addSectionBtn.addEventListener("click", () => {
        const newSection = createSectionCard();
        editSectionsList.appendChild(newSection);
        updateSectionOrderLabels();
        newSection.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      editSectionsList.addEventListener("dragstart", (event) => {
        const section = event.target.closest(".section-card-item");
        if (!section) {
          return;
        }

        draggedSection = section;
        section.classList.add("is-dragging");

        if (event.dataTransfer) {
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", "section-card");
        }
      });

      editSectionsList.addEventListener("dragover", (event) => {
        if (!draggedSection) {
          return;
        }

        event.preventDefault();
        clearDropTargets();

        const afterElement = getDragAfterElement(editSectionsList, event.clientY);
        if (!afterElement) {
          editSectionsList.appendChild(draggedSection);
          return;
        }

        afterElement.classList.add("is-drop-target");
        editSectionsList.insertBefore(draggedSection, afterElement);
      });

      editSectionsList.addEventListener("drop", (event) => {
        if (!draggedSection) {
          return;
        }

        event.preventDefault();
        clearDropTargets();
        updateSectionOrderLabels();
      });

      editSectionsList.addEventListener("dragend", () => {
        if (!draggedSection) {
          return;
        }

        draggedSection.classList.remove("is-dragging");
        draggedSection = null;
        clearDropTargets();
        updateSectionOrderLabels();
      });

      updateSectionOrderLabels();
      editBackBtn.addEventListener("click", navigateBackToList);
      editCancelBtn.addEventListener("click", navigateBackToList);
    </script>
  </body>
</html>
